name: redimos_manager
description: "Manage local & online redimos server instances — Flutter UI over a Go dynamic-library core."
publish_to: "none"
version: 1.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Righteous
      fonts:
        - asset: assets/fonts/Righteous-Regular.ttf
    # pixel-fidelity-v23 (CP 4.4/4.5): bundled variable faces so the app and
    # the mockup captures render with the SAME fonts. The mono family is
    # deliberately named `monospace` so the 14 bare `fontFamily: 'monospace'`
    # styles resolve to it without touching each call site.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: monospace
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
